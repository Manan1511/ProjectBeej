[build]
  command = "npm run build"
  publish = ".next"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/seed-sprout-b22cdee8a635.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[build.environment]
  NODE_VERSION = "22"
  # These are public storefront settings, not credentials. Keep scanning all real secrets.
  SECRETS_SCAN_OMIT_KEYS = "SHOPIFY_STORE_DOMAIN,SITE_URL,NEXT_PUBLIC_SITE_URL,SHOPIFY_MODE,SHOPIFY_API_VERSION,SHOPIFY_CHECKOUT_HOSTS,SHOPIFY_CHECKOUT_ORIGINS"
