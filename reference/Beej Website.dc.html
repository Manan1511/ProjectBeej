<script>
(function(){
  if (window.__beejAssetPatch) return; window.__beejAssetPatch = true;
  var fix = function(v){ if (typeof v !== 'string' || !/^(\.\/)?assets\//.test(v)) return v; var r = window.__resources; var k = 'a-' + v.replace(/^.*\//,'').replace(/\.\w+$/,''); return (r && r[k]) || v; };
  var sa = Element.prototype.setAttribute;
  Element.prototype.setAttribute = function(n, v){ if (n === 'src' || n === 'poster' || n === 'href') v = fix(v); return sa.call(this, n, v); };
  [[HTMLImageElement,'src'],[HTMLMediaElement,'src'],[HTMLVideoElement,'poster']].forEach(function(p){ var d = Object.getOwnPropertyDescriptor(p[0].prototype, p[1]); if (d && d.set) Object.defineProperty(p[0].prototype, p[1], { configurable: true, enumerable: d.enumerable, get: d.get, set: function(v){ d.set.call(this, fix(v)); } }); });
})();
</script>

<style>

body{margin:0;background:#F6F1E4;font-family:'Neue Haas Display Pro','Neue Haas Grotesk Display Pro','Hanken Grotesk',sans-serif;color:#2B3220;-webkit-font-smoothing:antialiased}

img{display:block}
@keyframes beejSpin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes beejFloatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes beejFloatB{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes beejMarquee{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="min-height:100vh;background:#F6F1E4">
  <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}"><dc-import name="Beej Home" hint-size="100%,100vh"></dc-import></sc-if>
  <sc-if value="{{ isShop }}" hint-placeholder-val="{{ false }}"><dc-import name="Beej Shop" hint-size="100%,100vh"></dc-import></sc-if>
  <sc-if value="{{ isProduct }}" hint-placeholder-val="{{ false }}"><dc-import name="Beej Product" hint-size="100%,100vh"></dc-import></sc-if>
  <sc-if value="{{ isAbout }}" hint-placeholder-val="{{ false }}"><dc-import name="Beej About" hint-size="100%,100vh"></dc-import></sc-if>
  <sc-if value="{{ isCart }}" hint-placeholder-val="{{ false }}"><dc-import name="Beej Cart" hint-size="100%,100vh"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { page: this._parse() };
  _parse() { const m = location.hash.match(/^#\/(home|shop|product|about|cart)/); return m ? m[1] : 'home'; }
  componentDidMount() {
    this._click = e => {
      const a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
      const m = (a.getAttribute('href') || '').match(/Beej(?:%20| )(Home|Shop|Product|About|Cart)\.dc\.html(\?[^#]*)?(#[\w-]+)?$/);
      if (!m) return;
      e.preventDefault();
      this._frag = m[3] || null;
      const h = '#/' + m[1].toLowerCase() + (m[2] || '');
      if (location.hash === h) this._go(); else location.hash = h;
    };
    this._go = () => {
      this.setState({ page: null });
      clearTimeout(this._t1); clearTimeout(this._t2);
      this._t1 = setTimeout(() => {
        this.setState({ page: this._parse() });
        window.scrollTo(0, 0);
        const f = this._frag; this._frag = null;
        if (f) this._t2 = setTimeout(() => { const el = document.querySelector(f); el && window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - 80); }, 500);
      }, 30);
    };
    document.addEventListener('click', this._click, true);
    window.addEventListener('hashchange', this._go);
  }
  componentWillUnmount() { document.removeEventListener('click', this._click, true); window.removeEventListener('hashchange', this._go); }
  renderVals() {
    const p = this.state.page;
    return { isHome: p === 'home', isShop: p === 'shop', isProduct: p === 'product', isAbout: p === 'about', isCart: p === 'cart' };
  }
}
</script>
