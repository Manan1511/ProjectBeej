<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer style="width:100%;background:#3A4229;color:#E4E6D4;font-family:'Neue Haas Display Pro','Neue Haas Grotesk Display Pro','Hanken Grotesk',sans-serif;padding:48px clamp(16px,5vw,64px) 32px">
  <div style="max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:36px">
    <div style="display:flex;flex-direction:column;gap:12px">
      <sc-if value="{{ logo }}" hint-placeholder-val="{{ false }}"><img src="{{ logo }}" alt="Project Beej" style="height:64px;width:auto;display:block;align-self:flex-start"></img></sc-if>
      <span style="font-size:14px;line-height:1.5;max-width:240px">Rooted in nature. Growing with purpose.</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;font-size:15px">
      <span style="font-weight:700;color:#C4D19B;font-size:13px;letter-spacing:1px;text-transform:uppercase">Shop</span>
      <a href="Beej%20Shop.dc.html" style="color:#E4E6D4">All snacks</a>
      <a href="Beej%20Shop.dc.html?line=Roasted%20Makhana" style="color:#E4E6D4">Roasted Makhana</a>
      <a href="Beej%20Shop.dc.html?line=Ready%20to%20Roast" style="color:#E4E6D4">Ready to Roast</a>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;font-size:15px">
      <span style="font-weight:700;color:#C4D19B;font-size:13px;letter-spacing:1px;text-transform:uppercase">Project Beej</span>
      <a href="Beej%20About.dc.html" style="color:#E4E6D4">Our story</a>
      <a href="Beej%20Cart.dc.html" style="color:#E4E6D4">Your bag</a>
      <a href="Beej%20Home.dc.html#gallery" style="color:#E4E6D4">#SnackWithBeej</a>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;font-size:15px">
      <span style="font-weight:700;color:#C4D19B;font-size:13px;letter-spacing:1px;text-transform:uppercase">Say hello</span>
      <a href="mailto:hello@projectbeej.com" style="color:#E4E6D4">hello@projectbeej.com</a>
      <span>Surat, Gujarat, India</span>
    </div>
  </div>
  <div style="max-width:1240px;margin:36px auto 0;border-top:1px solid rgba(196,209,155,.2);padding-top:18px;font-size:13px;color:#A9AE94">© 2026 Project Beej Foods Pvt. Ltd. · Product of India</div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:320}}">
class Component extends DCLogic {
  componentDidMount(){this._b=()=>this.forceUpdate();window.addEventListener('beej-ready',this._b)}
  componentWillUnmount(){window.removeEventListener('beej-ready',this._b)}
  renderVals(){ return { logo: window.BeejData ? BeejData.asset('assets/logo-wordmark.png') : 'assets/logo-wordmark.png' }; }
}
</script>
</body>
</html>
