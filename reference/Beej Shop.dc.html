<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="./beej-data.js"></script>
<style>
@font-face{font-family:'IvyOra Display';src:local('IvyOra Display'),local('IvyOraDisplay-Regular')}
@font-face{font-family:'Neue Haas Display Pro';src:local('Neue Haas Display Pro'),local('NeueHaasDisplay-Roman')}
body{margin:0;background:#F6F1E4;font-family:'Neue Haas Display Pro','Neue Haas Grotesk Display Pro','Hanken Grotesk',sans-serif;color:#2B3220;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#2B3220;text-decoration:none}
a:hover{color:#5E6B45}
img{display:block}
</style>
</helmet>
<div style="min-height:100vh;background:#F6F1E4;display:flex;flex-direction:column">
  <dc-import name="Beej Header" active="shop" hint-size="100%,100px" style="position:sticky;top:calc(-1 * var(--beej-bar-h, 38px));z-index:50"></dc-import>

  <section data-screen-label="Shop header" style="margin-top:calc(-1 * var(--beej-nav-h, 66px));position:relative;overflow:hidden;background:#3A4229;color:#F6F1E4;padding:calc(var(--beej-nav-h, 66px) + clamp(56px,8vw,104px)) clamp(20px,5vw,64px) clamp(56px,8vw,104px)">
    <img src="assets/leaves-dark.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></img>
    <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,24,14,.7),rgba(20,24,14,.2))"></div>
    <div style="position:relative;max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;gap:12px">
        <span style="font-weight:600;font-size:14px;letter-spacing:1px;text-transform:uppercase;color:#C4D19B">The Beej pantry</span>
        <h1 style="margin:0;font-family:'IvyOra Display','DM Serif Display',serif;font-weight:400;font-size:clamp(43.7px,6.2vw,87.4px);line-height:1.06;letter-spacing:-0.01em;font-kerning:normal">Shop all</h1>
      </div>
      <p style="margin:0;max-width:380px;font-size:17px;line-height:1.5;color:#E4E6D4;text-wrap:pretty">Snacks made from nature's humblest ingredients. Free shipping on orders above ₹499.</p>
    </div>
  </section>

  <section style="padding:28px clamp(20px,5vw,64px) clamp(64px,8vw,104px);flex:1">
    <div style="max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:32px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid #DCD5C0;padding-bottom:20px">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <sc-for list="{{ filters }}" as="c" hint-placeholder-count="3">
            <button onClick="{{ c.pick }}" style="cursor:pointer;font-family:'Neue Haas Display Pro','Neue Haas Grotesk Display Pro','Hanken Grotesk',sans-serif;font-weight:700;font-size:14px;padding:10px 18px;border-radius:999px;border:2px solid #2B3220;background:{{ c.bg }};color:{{ c.fg }}">{{ c.label }} <span style="opacity:.6;font-weight:600">{{ c.n }}</span></button>
          </sc-for>
        </div>
        <label style="display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600">Sort
          <select onChange="{{ setSort }}" value="{{ sort }}" style="font-family:'Neue Haas Display Pro','Neue Haas Grotesk Display Pro','Hanken Grotesk',sans-serif;font-size:14px;font-weight:600;padding:10px 14px;border-radius:999px;border:2px solid #2B3220;background:#F6F1E4;color:#2B3220;cursor:pointer">
            <option value="featured">Featured</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
          </select>
        </label>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:36px 20px">
        <sc-for list="{{ products }}" as="p" hint-placeholder-count="5">
          <dc-import name="Beej Product Card" pid="{{ p.id }}" hint-size="100%,460px"></dc-import>
        </sc-for>
      </div>
    </div>
  </section>

  <section data-screen-label="Shop lifestyle" style="padding:0 clamp(20px,5vw,64px) clamp(64px,8vw,104px)">
    <div style="max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:28px">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px">
        <h2 style="margin:0;font-family:'IvyOra Display','DM Serif Display',serif;font-weight:400;font-size:clamp(31.2px,3.9vw,53px);line-height:1.06;letter-spacing:-0.01em;font-kerning:normal">Snack spotted</h2>
        <span style="font-size:16px;color:#55594A">Desk, mat, couch — Beej goes where you go.</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));grid-auto-rows:clamp(200px,24vw,300px);gap:16px">
        <div style="grid-row:{{ tallSpan }};border-radius:28px;overflow:hidden"><img src="assets/pudina-hands.jpg" alt="Hands holding a Pudina jar" style="width:100%;height:100%;object-fit:cover"></img></div>
        <div style="border-radius:28px;overflow:hidden"><img src="assets/himalayan-reach.jpg" alt="Reaching for a Himalayan Salt &amp; Pepper jar" style="width:100%;height:100%;object-fit:cover"></img></div>
        <div style="border-radius:28px;overflow:hidden"><img src="assets/cheese-table.jpg" alt="Cheese jar on a yellow table" style="width:100%;height:100%;object-fit:cover"></img></div>
        <div style="grid-column:{{ wideSpan }};border-radius:28px;overflow:hidden;position:relative"><img src="assets/sprout-single.jpg" alt="A single seedling in soil" style="width:100%;height:100%;object-fit:cover"></img><span style="position:absolute;left:clamp(20px,3vw,32px);bottom:clamp(20px,3vw,28px);max-width:340px;font-family:'IvyOra Display','DM Serif Display',serif;font-size:clamp(24px,2.6vw,34px);line-height:1.1;color:#F6F1E4;letter-spacing:-0.01em">Every snack starts with a seed.</span></div>
      </div>
    </div>
  </section>

  <section style="padding:0 clamp(20px,5vw,64px) clamp(64px,8vw,104px)">
    <div style="max-width:1240px;margin:0 auto;border-radius:28px;background:#C4D19B;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:24px;padding:32px clamp(20px,4vw,48px)">
      <sc-for list="{{ perks }}" as="k" hint-placeholder-count="3">
        <div style="display:flex;flex-direction:column;gap:4px">
          <span style="font-family:'IvyOra Display','DM Serif Display',serif;font-size:18.7px;letter-spacing:-0.01em;font-kerning:normal">{{ k.t }}</span>
          <span style="font-size:15px;line-height:1.45">{{ k.b }}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <dc-import name="Beej Footer" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { filter: (window.BeejData ? BeejData.params() : new URLSearchParams(location.search)).get('line') || 'All', sort: 'featured' };
  componentDidMount(){this._b=()=>this.forceUpdate();window.addEventListener('beej-ready',this._b);window.addEventListener('resize',this._b);this._b()}
  componentWillUnmount(){window.removeEventListener('beej-ready',this._b);window.removeEventListener('resize',this._b)}
  renderVals() {
    const narrow = window.innerWidth < 640;
    const D = window.BeejData, all = D ? D.products : [];
    const { filter, sort } = this.state;
    const lines = ['All', ...new Set(all.map(p => p.line))];
    let list = all.filter(p => filter === 'All' || p.line === filter);
    if (sort === 'low') list = [...list].sort((a, b) => a.price - b.price);
    if (sort === 'high') list = [...list].sort((a, b) => b.price - a.price);
    return {
      tallSpan: narrow ? 'auto' : 'span 2', wideSpan: narrow ? 'auto' : 'span 2',
      sort,
      setSort: e => this.setState({ sort: e.target.value }),
      filters: lines.map(l => ({ label: l, n: l === 'All' ? all.length : all.filter(p => p.line === l).length, bg: l === filter ? '#2B3220' : 'transparent', fg: l === filter ? '#F6F1E4' : '#2B3220', pick: () => this.setState({ filter: l }) })),
      products: list,
      perks: [
        { t: 'Free shipping', b: 'On every order above ₹499.' },
        { t: 'Sealed fresh', b: 'Packed for crunch, resealable to keep it.' },
        { t: 'Made in India', b: 'From Surat, Gujarat, to your door.' }
      ]
    };
  }
}
</script>
</body>
</html>
