<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./beej-data.js"></script>
</helmet>
<header style="width:100%;font-family:'Neue Haas Display Pro','Neue Haas Grotesk Display Pro','Hanken Grotesk',sans-serif">
  <div ref="{{ barRef }}" style="background:#C4D19B;color:#2B3220;text-align:center;font-weight:600;font-size:{{ barFont }};padding:9px 16px">Free shipping on orders above ₹499 🌱</div>
  <nav ref="{{ navRef }}" style="display:grid;grid-template-columns:{{ cols }};grid-template-areas:{{ areas }};align-items:center;gap:{{ gap }};padding:{{ navPad }} clamp(16px,5vw,64px);background:{{ navBg }};backdrop-filter:blur(12px) saturate(1.1);-webkit-backdrop-filter:blur(12px) saturate(1.1);border-bottom:1px solid rgba(196,209,155,.16);box-shadow:{{ shadow }};transition:background .35s ease,box-shadow .35s ease">
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <div style="grid-area:links;display:flex;gap:clamp(18px,2.4vw,28px);font-weight:600;font-size:15px;flex-wrap:wrap">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="3">
          <a href="{{ l.href }}" onMouseEnter="{{ l.enter }}" onMouseLeave="{{ l.leave }}" style="position:relative;color:#F6F1E4;padding:4px 0;transition:color .25s ease" style-hover="color:#C4D19B">{{ l.label }}<span style="position:absolute;left:0;right:0;bottom:-2px;height:2px;background:#C4D19B;transform:scaleX({{ l.scale }});transform-origin:left;transition:transform .3s cubic-bezier(.3,.7,.2,1)"></span></a>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMenu }}" aria-label="Menu" aria-expanded="{{ menuOpen }}" style="grid-area:links;justify-self:start;width:44px;height:44px;margin-left:-10px;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0">
        <span style="width:22px;height:2px;border-radius:2px;background:#F6F1E4;transform:{{ bar1 }};transition:transform .3s ease"></span>
        <span style="width:22px;height:2px;border-radius:2px;background:#F6F1E4;opacity:{{ bar2 }};transition:opacity .2s ease"></span>
        <span style="width:22px;height:2px;border-radius:2px;background:#F6F1E4;transform:{{ bar3 }};transition:transform .3s ease"></span>
      </button>
    </sc-if>
    <a href="Beej%20Home.dc.html" style="grid-area:logo;display:block;padding:{{ logoPad }};justify-self:{{ logoJustify }};transition:transform .3s ease" style-hover="transform:rotate(-3deg) scale(1.04)"><sc-if value="{{ logo }}" hint-placeholder-val="{{ false }}"><img src="{{ logo }}" alt="Project Beej" style="height:{{ logoH }};width:auto;display:block;transform:{{ logoTf }};transform-origin:{{ logoOrigin }};transition:transform .35s ease"></img></sc-if></a>
    <div style="grid-area:bag;display:flex;justify-content:flex-end">

      <sc-if value="{{ true }}" hint-placeholder-val="{{ true }}">
        <a href="Beej%20Cart.dc.html" aria-label="Bag" style="position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-right:-8px;color:#F6F1E4;transform:{{ bagTf }};transition:transform .35s cubic-bezier(.3,1.6,.5,1)" style-hover="color:#C4D19B">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
          <span style="position:absolute;top:4px;right:2px;background:#C4D19B;color:#2B3220;border-radius:999px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-size:11px;font-weight:800">{{ count }}</span>
        </a>
      </sc-if>
    </div>
  </nav>
  <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
    <div style="overflow:hidden;max-height:{{ menuH }};background:#2B3220;transition:max-height .4s cubic-bezier(.3,.7,.2,1);box-shadow:0 14px 30px rgba(20,24,12,.3)">
      <div style="display:flex;flex-direction:column;padding:6px clamp(16px,5vw,64px) 22px">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="3">
          <a href="{{ l.href }}" onClick="{{ closeMenu }}" style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid rgba(196,209,155,.16);font-family:'IvyOra Display','DM Serif Display',serif;font-size:26px;letter-spacing:-0.01em;color:{{ l.mfg }}" style-hover="color:#C4D19B">{{ l.label }}<span style="font-family:'Hanken Grotesk',sans-serif;font-size:18px;color:#C4D19B">→</span></a>
        </sc-for>
        <span style="padding-top:16px;font-size:13px;color:#C4D19B">Free shipping on orders above ₹499</span>
      </div>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:130},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;shop&quot;,&quot;about&quot;,&quot;cart&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: window.innerWidth, s: false, past: true, menu: false, hov: -1, bump: false };
  componentDidMount(){this._r=()=>this.setState({w:window.innerWidth});window.addEventListener('resize',this._r);this._r();requestAnimationFrame(this._r);this._ro2=new ResizeObserver(this._r);this._ro2.observe(document.documentElement);
    this._s=()=>{const s=window.scrollY>20;const hero=document.querySelector('section[data-screen-label="Home hero"],section[data-screen-label="Shop header"],section[data-screen-label="About hero"]');const nh=this._nav?this._nav.offsetHeight:66;const past=hero?hero.getBoundingClientRect().bottom<=nh:true;if(s!==this.state.s||past!==this.state.past)this.setState({s,past})};window.addEventListener('scroll',this._s,{passive:true});this._s();
    this._c=()=>{const c=window.BeejData?BeejData.cart.count():0;if(this._last!=null&&c>this._last){this.setState({bump:true});clearTimeout(this._t);this._t=setTimeout(()=>this.setState({bump:false}),380)}this._last=c};window.addEventListener('beej-cart',this._c);this._c();this._b=()=>{this.forceUpdate();if(window.BeejData&&!this._u)this._u=BeejData.cart.on(()=>this.forceUpdate())};window.addEventListener('beej-ready',this._b);this._b()}
  componentWillUnmount(){this._ro2&&this._ro2.disconnect();this._ro&&this._ro.disconnect();window.removeEventListener('resize',this._r);window.removeEventListener('scroll',this._s);window.removeEventListener('beej-cart',this._c);clearTimeout(this._t);window.removeEventListener('beej-ready',this._b);this._u&&this._u()}
  _watch(k, el) {
    this._ro = this._ro || new ResizeObserver(es => es.forEach(e => document.documentElement.style.setProperty('--beej-' + e.target.dataset.k + '-h', e.target.offsetHeight + 'px')));
    if (el && !el.dataset.k) { el.dataset.k = k; this._ro.observe(el); }
  }
  renderVals() {
    const a = this.props.active ?? 'home';
    const L = [['home', 'Home', 'Beej%20Home.dc.html'], ['shop', 'Shop', 'Beej%20Shop.dc.html'], ['about', 'Our Story', 'Beej%20About.dc.html']];
    const n = window.innerWidth < 760, open = n && this.state.menu;
    return {
      cols: '1fr auto 1fr', areas: '"links logo bag"', gap: n ? '8px' : '16px', wide: !n, narrow: n, menuOpen: open,
      toggleMenu: () => this.setState(st => ({ menu: !st.menu })), closeMenu: () => this.setState({ menu: false }),
      bar1: open ? 'translateY(7px) rotate(45deg)' : 'none', bar2: open ? 0 : 1, bar3: open ? 'translateY(-7px) rotate(-45deg)' : 'none',
      menuH: open ? '360px' : '0px', barFont: n ? '12.5px' : '14px', bagPad: n ? '4px 5px 4px 12px' : '5px 6px 5px 14px', bagFont: n ? '14px' : '15px',
      linksJustify: n ? 'center' : 'flex-start', linksBorder: n ? '1px solid rgba(196,209,155,.18)' : 'none', linksPad: n ? '10px' : '0',
      logoH: n ? '36px' : '46px', logoTf: this.state.s ? 'scale(.86)' : 'none', logoOrigin: 'center', navPad: '4px',
      navBg: (this.state.past || open) ? 'rgba(43,50,32,1)' : 'rgba(20,24,13,.55)',
      barRef: el => this._watch('bar', el), navRef: el => { this._nav = el; this._watch('nav', el); },
      shadow: this.state.s ? '0 8px 24px rgba(20,24,12,.28)' : 'none', bagTf: this.state.bump ? 'scale(1.15) rotate(-4deg)' : 'none', logoPad: n ? '4px 0' : '6px 0', logoJustify: 'center',
      logo: window.BeejData ? BeejData.asset('assets/logo-wordmark.png') : 'assets/logo-wordmark.png',
      count: window.BeejData ? BeejData.cart.count() : 0,
      links: L.map(([k, label, href], i) => ({ label, href, mfg: k === a ? '#C4D19B' : '#F6F1E4', scale: (k === a || this.state.hov === i) ? 1 : 0, enter: () => this.setState({ hov: i }), leave: () => this.setState({ hov: -1 }) }))
    };
  }
}
</script>
</body>
</html>
