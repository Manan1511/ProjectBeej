<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./beej-data.js"></script>
</helmet>
<div onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" style="width:100%;height:100%;display:flex;flex-direction:column;gap:14px;font-family:'Neue Haas Display Pro','Neue Haas Grotesk Display Pro','Hanken Grotesk',sans-serif;color:#2B3220">
  <a href="{{ href }}" style="position:relative;display:block;aspect-ratio:4/5;border-radius:24px;overflow:hidden;background:{{ tint }}">
    <sc-if value="{{ img1 }}" hint-placeholder-val="{{ false }}"><img src="{{ img1 }}" alt="{{ name }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block"></img></sc-if>
    <sc-if value="{{ img2 }}" hint-placeholder-val="{{ false }}"><img src="{{ img2 }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity .4s ease;opacity:{{ hoverOpacity }}"></img></sc-if>
    <sc-if value="{{ hasTag }}" hint-placeholder-val="{{ false }}">
      <span style="position:absolute;top:12px;left:12px;background:#F6F1E4;color:#2B3220;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:6px 11px;border-radius:999px">{{ tag }}</span>
    </sc-if>
  </a>
  <div style="display:flex;flex-direction:column;gap:4px;padding:0 4px">
    <span style="font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#6E7D4E">{{ line }}</span>
    <a href="{{ href }}" style="font-family:'IvyOra Display','DM Serif Display',serif;font-size:clamp(20px,5vw,24px);line-height:1.12;color:#2B3220;letter-spacing:-0.01em;font-kerning:normal">{{ name }}</a>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px 12px;margin-top:10px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column">
        <span style="font-weight:800;font-size:19px">{{ price }}</span>
        <span style="font-size:13px;color:#6B6F5C">{{ size }}</span>
      </div>
      <button onClick="{{ add }}" style="border:none;cursor:pointer;background:#2B3220;color:#F6F1E4;font-family:'Neue Haas Display Pro','Neue Haas Grotesk Display Pro','Hanken Grotesk',sans-serif;font-weight:800;font-size:13px;letter-spacing:.5px;text-transform:uppercase;padding:12px 18px;min-height:44px;border-radius:999px;white-space:nowrap" style-hover="background:#5E6B45">{{ cta }}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:520},&quot;pid&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;peri&quot;,&quot;cheese&quot;,&quot;himalayan&quot;,&quot;pudina&quot;,&quot;classic&quot;],&quot;default&quot;:&quot;peri&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { hover: false, justAdded: false };
  componentDidMount(){this._b=()=>this.forceUpdate();window.addEventListener('beej-ready',this._b);this._b()}
  componentWillUnmount(){window.removeEventListener('beej-ready',this._b);clearTimeout(this._t)}
  renderVals() {
    const D = window.BeejData;
    const p = D && D.byId(this.props.pid ?? 'peri');
    if (!p) return { name: '', hasTag: false };
    return {
      name: p.name, line: p.line, size: p.size, tint: p.tint, tag: p.tag, hasTag: !!p.tag,
      price: D.money(p.price), href: D.productUrl(p.id),
      img1: p.images[0], img2: p.images[1] || p.images[0],
      hoverOpacity: this.state.hover ? 1 : 0,
      cta: this.state.justAdded ? 'Added ✓' : 'Add',
      enter: () => this.setState({ hover: true }),
      leave: () => this.setState({ hover: false }),
      add: () => { D.cart.add(p.id, 1); this.setState({ justAdded: true }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ justAdded: false }), 1400); }
    };
  }
}
</script>
</body>
</html>
